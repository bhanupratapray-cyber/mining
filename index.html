<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rocksteady</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <div class="segment-tabs">
            <button id="tab-supervisor" class="active" onclick="setRole('supervisor')">SUPERVISOR</button>
            <button id="tab-admin" onclick="setRole('admin')">ADMIN</button>
        </div>

        <div id="supervisor-form">
            <input type="text" id="sup-id" class="input-field" placeholder="Supervisor ID">
            <input type="password" id="sup-pin" class="input-field" placeholder="4-Digit PIN">
        </div>

        <div id="admin-form" class="hidden">
            <input type="text" id="admin-user" class="input-field" placeholder="Username">
            <input type="password" id="admin-pass" class="input-field" placeholder="Password">
        </div>

        <div id="error-msg" class="text-danger hidden"></div>

        <button class="btn btn-warning" onclick="handleLogin()">ENTER SITE</button>
    </div>

    <script src="app.js"></script>
    <script src="login.js"></script>
</body>
</html>
