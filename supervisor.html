<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Portal - Ray Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div style="flex:1; text-align:left;">Supervisor Portal</div>
        <div class="header-icons" style="display:flex; align-items:center; gap: 15px;">
            <span class="icon-btn" onclick="openSettings()">⚙️</span>
            <a href="index.html" style="color: var(--danger); font-size:14px; font-weight:500; text-decoration:none;">Logout</a>
        </div>
    </div>
    
    <!-- Phase 13: RBAC Shift & Date -->
    <div style="display: flex; justify-content: space-between; padding: 10px 20px; background: var(--header-bg); border-bottom: 1px solid var(--border-color);">
        <div id="date-container"></div>
        <div id="shift-container"></div>
    </div>
    
    <!-- Phase 13: Dynamic Role Tabs -->
    <div class="tabs" id="role-tabs" style="padding: 10px 20px; background: var(--bg-color);">
        <!-- Roles generated dynamically -->
    </div>

    <!-- Phase 13: Attendance Marking List -->
    <div class="container main-content" id="workers-list" style="padding-bottom: 80px;">
        <!-- Workers list generated dynamically -->
    </div>

    <!-- Submit Button Fixed Bottom -->
    <div style="padding: 15px 20px; background: var(--card-bg); position: fixed; bottom: 0; width: 100%; box-sizing: border-box; border-top: 1px solid var(--border-color); display:flex; justify-content:center;">
        <button class="btn btn-success" style="margin: 0; max-width: 400px;" id="submit-btn" onclick="submitAttendance()">SUBMIT ATTENDANCE</button>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden" onclick="if(event.target===this) closeSettings()">
        <div class="modal-content">
            <h2 style="margin-top:0;">Settings</h2>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span>Light Theme</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="theme-toggle" onchange="toggleTheme(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #888; font-style: normal; line-height: 1.6;">
                <strong>Ray Attendance</strong><br>
                Version V.2.0.1<br>
                Developed by Bhanupratap Ray<br>
                Email: bhanupratapray39@gmail.com<br>
                Mobile: +91 7232842354
            </div>
            <button class="btn btn-outline" onclick="closeSettings()" style="margin-top: 20px;">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="supervisor.js"></script>
</body>
</html>
