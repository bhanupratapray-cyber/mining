<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Portal - Rocksteady</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        Supervisor Portal
        <a href="index.html">Logout</a>
    </div>
    
    <div class="toolbar-controls">
        <div id="date-container"></div>
        <div id="shift-container"></div>
    </div>
    
    <div class="tabs" id="role-tabs">
        <!-- Roles generated dynamically -->
    </div>

    <div class="container main-content" id="workers-list">
        <!-- Workers list generated dynamically -->
    </div>

    <div style="padding: 20px; background: #1e1e1e; position: fixed; bottom: 0; width: 100%; box-sizing: border-box;">
        <button class="btn btn-success" style="margin: 0;" onclick="submitAttendance()">SUBMIT ATTENDANCE</button>
    </div>

    <script src="app.js"></script>
    <script src="supervisor.js"></script>
</body>
</html>
